<p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 165pt; mso-char-indent-count: 7.5"><span style="font-size: 22pt; font-family: 黑体">&nbsp;&nbsp; 讣<span lang="EN-US"><span style="mso-spacerun: yes">&nbsp;&nbsp; </span></span>告<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><span lang="EN-US" style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast"><o:p>&nbsp;</o:p></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast">北京大学校园服务中心职工安龙庆因心源性猝死，与<span lang="EN-US">2015</span>年<span lang="EN-US">3</span>月<span lang="EN-US">10</span>日在北京逝世，终年<span lang="EN-US">48</span>岁。<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast">安龙庆同志<span lang="EN-US">1967</span>年<span lang="EN-US">8</span>月<span lang="EN-US">6</span>日生于北京，<span lang="EN-US">1987</span>年参加工作。他工作认真负责，踏实肯干，获得领导和同志的一致好评！<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast">安龙庆同志的逝世使我们失去了一位好同事、好兄弟，我们深感惋惜和悲痛。愿安龙庆同志一路走好！<span lang="EN-US"><o:p></o:p></span></span></p><p align="left" class="MsoNormal" style="text-align: left; margin: 0cm 0cm 0pt; line-height: 150%; text-indent: 28pt; mso-pagination: widow-orphan"><span style="font-size: 14pt; font-family: 宋体; line-height: 150%; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">安龙庆同志的遗体告别仪式于<span lang="EN-US">2015</span>年<span lang="EN-US">3</span>月<span lang="EN-US">12</span>日，上午<span lang="EN-US">8</span>：<span lang="EN-US">30</span>，在昌平殡仪馆举行。拟参加告别仪式的同志请于<span lang="EN-US">2015</span>年<span lang="EN-US">3</span>月<span lang="EN-US">12</span>日上午<span lang="EN-US">6</span>：<span lang="EN-US">40</span>在北京大学东门遥感楼前上车。<span lang="EN-US"><o:p></o:p></span></span></p><p align="left" class="MsoNormal" style="text-align: left; margin: 0cm 0cm 0pt; mso-pagination: widow-orphan"><span lang="EN-US" style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">&nbsp;<o:p></o:p></span></p><p align="left" class="MsoNormal" style="text-align: left; margin: 0cm 0cm 0pt; mso-pagination: widow-orphan"><span lang="EN-US" style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">&nbsp;<o:p></o:p></span></p><p align="left" class="MsoNormal" style="text-align: left; margin: 0cm 0cm 0pt; mso-pagination: widow-orphan"><span lang="EN-US" style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">&nbsp;<o:p></o:p></span></p><p align="right" class="MsoNormal" style="text-align: right; margin: 0cm 0cm 0pt; mso-pagination: widow-orphan"><span lang="EN-US" style="font-size: 14pt; font-family: 宋体; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">&nbsp;<o:p></o:p></span></p><p align="left" class="MsoNormal" style="text-align: left; margin: 0cm 0cm 0pt; line-height: 150%; text-indent: 287pt; mso-pagination: widow-orphan"><span style="font-size: 14pt; font-family: 宋体; line-height: 150%; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">校园服务中心<span lang="EN-US"><o:p></o:p></span></span></p><p align="left" class="MsoNormal" style="text-align: left; margin: 0cm 0cm 0pt; line-height: 150%; text-indent: 301pt; mso-pagination: widow-orphan"><span lang="EN-US" style="font-size: 14pt; font-family: 宋体; line-height: 150%; mso-ascii-theme-font: minor-fareast; mso-fareast-font-family: 宋体; mso-fareast-theme-font: minor-fareast; mso-hansi-theme-font: minor-fareast; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">2015.3.11<o:p></o:p></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><span lang="EN-US" style="font-size: 14pt"><o:p><font face="Calibri">&nbsp;</font></o:p></span></p>
