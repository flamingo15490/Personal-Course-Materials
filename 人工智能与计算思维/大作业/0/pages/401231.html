<p style="margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><br/></p><p style="margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69); text-align: center;"><span style="caret-color: rgb(69, 69, 69); color: rgb(69, 69, 69); font-family: 黑体, SimHei; font-size: 24px;">讣 &nbsp; &nbsp;告</span><span style="font-family: 黑体, SimHei; font-size: 18px;"><span style="caret-color: rgb(69, 69, 69); color: rgb(69, 69, 69); font-family: 黑体, SimHei; font-size: 18px;"></span><span style="caret-color: rgb(69, 69, 69); color: rgb(69, 69, 69); font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;"></span><span style="font-family: 黑体, SimHei; font-stretch: normal; line-height: normal;"></span></span></p><p style="margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px;"><br/></span></p><p style="margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69); text-align: justify;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; &nbsp; 北京大学物理学院基础物理实验教学中心王银第老师因病医治无效，于<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">2022</span>年<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">2</span>月<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">8</span>日在美国逝世，享年<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">84</span>岁。</span></p><p style="text-align: justify; margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; &nbsp; 王银第老师</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">1938</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">年</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">11</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">月</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">18</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">日出生于山东济南。</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">1956</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">年</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">5</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">月入职北京大学，</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">1994</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">年</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px; font-stretch: normal; line-height: normal;">8</span><span style="text-align: left; font-family: 黑体, SimHei; font-size: 18px;">月退休。</span></p><p style="text-align: left; margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; &nbsp; 王银第老师在工作上严谨治学、积极认真，获“国家级有突出贡献中青年专家”称号；在生活中为人谦恭诚恳、乐于助人，备受广大师生尊敬和爱戴。</span></p><p style="text-align: left; margin-top: 0px; margin-bottom: 0px; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px; text-align: justify;">&nbsp; &nbsp; &nbsp; 遵照本人遗愿及家属意见，王银第老师的丧事一切从简，不举行遗体告别仪式。谨此讣告，共寄哀思。</span><span style="font-family: 黑体, SimHei; font-size: 18px; text-align: justify; font-stretch: normal; line-height: normal;">&nbsp;</span></p><p style="margin-top: 0px; margin-bottom: 0px; text-align: justify; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;Helvetica Neue&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp;</span></p><p style="margin-top: 0px; margin-bottom: 0px; text-align: right; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px;">北京大学物理学院</span></p><p style="margin-top: 0px; margin-bottom: 0px; text-align: right; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;.PingFang SC&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px;">王银第老师治丧委员会<span style="caret-color: rgb(69, 69, 69); color: rgb(69, 69, 69); font-family: 黑体, SimHei; font-size: 18px; text-align: justify;"></span></span></p><p style="margin-top: 0px; margin-bottom: 0px; text-align: right; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;Helvetica Neue&quot;; color: rgb(69, 69, 69);"><span style="font-family: 黑体, SimHei; font-size: 18px;">2022<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">年</span>2<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">月</span>10<span style="font-stretch: normal; line-height: normal; font-family: 黑体, SimHei; font-size: 18px;">日<span style="caret-color: rgb(69, 69, 69); color: rgb(69, 69, 69); font-family: 黑体, SimHei; font-size: 18px; text-align: justify;"></span></span></span></p><p style="margin-top: 0px; margin-bottom: 0px; text-align: justify; font-stretch: normal; font-size: 12px; line-height: normal; font-family: &quot;Helvetica Neue&quot;; color: rgb(69, 69, 69);">&nbsp;</p><p style="font-family: -webkit-standard; white-space: normal;">&nbsp;</p>
