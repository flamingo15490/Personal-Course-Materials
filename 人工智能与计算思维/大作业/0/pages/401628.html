<p style="text-align:center"><strong><span style="font-size:29px">讣&nbsp; 告</span></strong></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="text-indent:37px"><span style="font-size:19px;font-family:黑体">北京大学化学学院赵永和老师因病于2022年2月25日23时52分在北京大学医院去世，享年85岁。</span></p><p style="text-indent:37px"><span style="font-size:19px;font-family:黑体">赵永和老师1956年9月到北京大学技术物理系工作，在钴源实验室从事实验室管理工作，1997年获聘高级实验师，1997年10月退休。</span></p><p style="text-indent:37px"><span style="font-size:19px;font-family:黑体">赵永和老师在钴源实验室工作了一生，勤勤恳恳，兢兢业业，钴源安全运转几十年与他的辛勤付出密不可分。对于赵永和老师的不幸离世，我们表示深切的哀悼。</span></p><p style="text-indent:19px"><span style="font-size:19px;font-family:黑体">&nbsp; </span><span style="font-size:19px;font-family:黑体">遵照家属的意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="text-indent:37px"><span style="font-size:19px;font-family:黑体">愿赵永和老师一路走好！</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-size:19px;font-family:黑体">&nbsp;</span></p><p style="text-align:right"><span style="font-size:19px;font-family:黑体">北京大学化学学院</span></p><p style="text-align: right;"><span style="font-size:19px;font-family:黑体">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2022</span><span style="font-size:19px;font-family:黑体">年2月28日</span></p>
