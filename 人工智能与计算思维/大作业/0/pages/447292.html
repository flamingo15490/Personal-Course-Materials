<p style="text-align:center"><strong><span style="font-size:21px;font-family:黑体">讣 &nbsp;&nbsp;&nbsp;告</span></strong></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-size:20px;font-family:仿宋">&nbsp;</span></p><p style="text-indent:40px"><span style="font-size:20px;font-family:仿宋">北京大学工学院实验师李长龄老师，因病于2025年6月8日上午11时在北京逝世，享年83岁。</span></p><p style="text-indent:40px"><span style="font-size:20px;font-family:仿宋">李长龄老师于1942年2月出生，1961年9月进入北京大学力学系，从事实验教学工作，参与多门实验课程及科研项目的教学研究工作，2002年3月退休。</span></p><p style="text-indent:40px"><span style="font-size:20px;font-family:仿宋">李长龄老师为人谦逊，真诚善良，在工作中一直兢兢业业，勤奋严谨，甘于奉献，深受广大师生的尊敬和爱戴。</span></p><p style="text-indent:40px"><span style="font-size:20px;font-family:仿宋">深切缅怀李长龄老师！李长龄老师千古！</span></p><p style="text-indent:40px"><span style="font-size:20px;font-family:仿宋">遵照家属意愿，丧事从简，谨此讣告，共寄哀思。</span></p><p style="text-indent:40px"><span style="font-size:20px;font-family:仿宋">&nbsp;</span></p><p style="margin-right:40px;text-align:right;text-indent:40px"><span style="font-size:20px;font-family:仿宋">北京大学工学院</span></p><p style="margin-right:40px;text-align:right;text-indent:40px"><span style="font-size:20px;font-family:仿宋">2025</span><span style="font-size:20px;font-family:仿宋">年6月9日</span></p>
