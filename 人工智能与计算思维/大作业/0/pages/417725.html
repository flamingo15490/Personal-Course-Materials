<p style="margin-top:auto;margin-bottom: auto;text-align:center;line-height:30px"><br/></p><p style="margin-top:auto;margin-bottom:auto;text-indent:37px;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">中国共产党党员、北京大学图书馆离休干部罗伯庚同志因病医治无效，于2023年2月26日在北京辞世，享年95岁。</span></p><p style="margin-top:auto;margin-bottom:auto;text-indent:37px;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">罗伯庚同志</span><span style="font-size:19px;font-family:黑体;color:black">1928</span><span style="font-size: 19px;font-family:黑体;color:black">年11月20日生于湖南省攸县</span><span style="font-size:19px;font-family:黑体;color:#444444">。1949年8月参加工作，1954年9月到北京大学工作，先后在北京大学东语系、人事处工作，1958年8月到北京大学图书馆工作，先后从事阅览室、中文编目等工作，</span><span style="font-size:19px;font-family:黑体;color:black">1988</span><span style="font-size:19px;font-family:黑体;color:black">年12月在图书馆离</span><span style="font-size:19px;font-family:黑体;color:#444444">休。</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:left;text-indent:37px;line-height: 30px"><span style="font-size:19px;font-family: 黑体;color:#444444">尊重罗伯庚同志家属意见，丧事从简。谨此讣告，共寄哀思。</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:left;text-indent:37px;line-height: 30px"><span style="font-size:19px;font-family: 黑体;color:#444444">罗伯庚同志千古！</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:left;text-indent:37px;line-height: 30px"><span style="font-size:19px;font-family:黑体;color:#444444">&nbsp;</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:right;line-height:30px"><span style="font-size:18px;font-family:黑体;color:#444444">北京大学图书馆</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:right;line-height:30px"><span style="font-size:18px;font-family:黑体;color:#444444">2023</span><span style="font-size:18px;font-family:黑体;color:#444444">年2月28日</span></p>
