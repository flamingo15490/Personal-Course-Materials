<p class="MsoNormal" style="text-indent:32.05pt;mso-char-indent-count:2.0"><b><span style="font-size:16.0pt;font-family:华文楷体">中国共产党党员、北京大学数学科学学院教授黄文灶同志因病医治无效，不幸于<span lang="EN-US">2017</span>年<span lang="EN-US">5</span>月<span lang="EN-US">7</span>日在北京逝世，享年<span lang="EN-US">81</span>岁。<span lang="EN-US"><o:p></o:p></span></span></b></p><p class="MsoNormal" style="text-indent:32.05pt;mso-char-indent-count:2.0"><b><span style="font-size:16.0pt;font-family:华文楷体">黄文灶同志<span lang="EN-US">1936</span>年<span lang="EN-US">8</span>月出生于福建省莆田市。<span lang="EN-US">1960</span>年<span lang="EN-US">5</span>月参加工作，<span lang="EN-US">1960</span>年至<span lang="EN-US">1969</span>年在北京大学数学力学系工作，<span lang="EN-US">1969</span>年底至<span lang="EN-US">1977</span>年在北京大学电子仪器厂工作，<span lang="EN-US">1978</span>年至<span lang="EN-US">1999</span>年在北京大学数学科学学院工作，先后任职助教、讲师、副教授、教授，<span lang="EN-US">1999</span>年退休。<span lang="EN-US"><o:p></o:p></span></span></b></p><p class="MsoNormal" style="text-indent:32.05pt;mso-char-indent-count:2.0"><b><span lang="EN-US" style="font-size:16.0pt;font-family:华文楷体"><o:p>&nbsp;</o:p></span></b></p><p class="MsoNormal" style="text-indent:32.05pt;mso-char-indent-count:2.0"><b><span style="font-size:16.0pt;font-family:华文楷体">根据家属的意愿，定于<span lang="EN-US">2017</span>年<span lang="EN-US">5</span>月<span lang="EN-US">9</span>日上午<span lang="EN-US">11</span>时，在八宝山殡仪馆竹厅举行黄文灶同志遗体告别仪式。<span lang="EN-US"><o:p></o:p></span></span></b></p><p class="MsoNormal" style="text-indent:32.05pt;mso-char-indent-count:2.0"><b><span lang="EN-US" style="font-size:16.0pt;font-family:华文楷体">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></b><b><span style="font-size:16.0pt;font-family:华文楷体">谨此讣告。<span lang="EN-US"><o:p></o:p></span></span></b></p><p class="MsoNormal" style="text-indent:32.05pt;mso-char-indent-count:2.0"><b><span lang="EN-US" style="font-size:16.0pt;font-family:华文楷体"><o:p>&nbsp;</o:p></span></b></p><p align="right" class="MsoDate" style="margin-left:0cm;mso-para-margin-left:0gd;text-align:right"><span style="font-size:16.0pt;font-family:华文楷体">北京大学数学科学学院<span lang="EN-US"><o:p></o:p></span></span></p>
