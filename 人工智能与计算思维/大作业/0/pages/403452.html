<p style="font-size: medium;white-space: normal;text-indent: 36px;line-height: 41px;background: white"><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">中国共产党党员、北京大学保卫部退休职工白秀英同志，因病医治无效，于2022年4月17日在中国中医科学院西苑医院逝世，享年84岁。</span></p><p style="font-size: medium;white-space: normal;text-align: justify;text-indent: 43px;line-height: 30px"><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">白秀英，满族，1937年10月24日出生，1951年11月参加工作，1960年9月入党。1978年10月到北京大学保卫部工作，至1988年11月退休。曾获北京市“先进生产者”、北京市“青年红旗手”、北京市 “三八红旗手”等荣誉称号。</span></p><p style="font-size: medium;white-space: normal;text-align: justify;text-indent: 43px;line-height: 29px"><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">对于白秀英老师的去世，我们表示深切哀悼。愿白老师一路走好！</span></p><p style="font-size: medium;white-space: normal;text-indent: 36px;line-height: 41px;background: white"><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">遵照家属意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="font-size: medium;white-space: normal;text-indent: 32px;line-height: 41px;background: white"><span style="font-size: 18px;font-family: Calibri, sans-serif;color: rgb(75, 75, 75)">&nbsp;</span></p><p style="font-size: medium;white-space: normal;text-align: right;text-indent: 36px;line-height: 41px;background: white"><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">北京大学保卫部</span></p><p style="font-size: medium;white-space: normal;text-align: right;text-indent: 36px;line-height: 41px;background: white"><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">2022</span><span style="font-size: 18px;font-family: 黑体;color: rgb(75, 75, 75)">年4月19日</span></p>
