&nbsp;<p align="center" class="MsoNormal" style="text-align:center"><b><span style="font-size:26.0pt;mso-bidi-font-size:11.0pt;font-family:黑体">讣 &nbsp;告<span lang="EN-US"><o:p></o:p></span></span></b></p><p class="MsoNormal" style="text-indent:32.0pt;mso-char-indent-count:2.0"><span lang="EN-US" style="font-size:16.0pt;font-family:仿宋"><o:p>&nbsp;</o:p></span></p><p class="MsoNormal" style="text-indent:32.0pt;mso-char-indent-count:2.0"><span style="font-size:16.0pt;font-family:仿宋">会议中心勺园管理部原副总经理王锡茂同志，因病于<span lang="EN-US">2019</span>年<span lang="EN-US">2</span>月<span lang="EN-US">28</span>日下午在北京大学第三医院逝世，享年<span lang="EN-US">64</span>岁。<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="text-indent:32.0pt;mso-char-indent-count:2.0"><span style="font-size:16.0pt;font-family:仿宋">为寄托哀思，遵照家属的意愿，兹定于<span lang="EN-US">2019</span>年<span lang="EN-US">3</span>月<span lang="EN-US">2</span>日上午<span lang="EN-US">9</span>点在昌平殡仪馆久安厅举行遗体告别仪式。<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="text-indent:32.0pt;mso-char-indent-count:2.0"><span style="font-size:16.0pt;font-family:仿宋">沉痛悼念王锡茂同志！王锡茂同志千古！<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="text-indent:32.0pt;mso-char-indent-count:2.0"><span lang="EN-US" style="font-size:16.0pt;font-family:仿宋"><o:p>&nbsp;</o:p></span></p><p class="MsoNormal" style="text-indent:240.0pt;mso-char-indent-count:15.0"><span style="font-size:16.0pt;font-family:仿宋">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 北京大学会议中心<span lang="EN-US"><o:p></o:p></span></span></p><p class="MsoNormal" style="text-indent:240.0pt;mso-char-indent-count:15.0"><span lang="EN-US" style="font-size:16.0pt;font-family:仿宋">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;2019</span><span style="font-size:16.0pt;font-family:仿宋">年<span lang="EN-US">3</span>月<span lang="EN-US">1</span>日<span lang="EN-US"><o:p></o:p></span></span></p>
