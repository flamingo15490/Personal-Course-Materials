<p style="text-align:center"><strong><span style="font-size:35px;font-family:黑体;color:#444444">讣 告</span></strong></p><p style="text-align:left;text-indent:28px;line-height:30px"><span style="font-size:20px;font-family:黑体;color:#444444">北京大学化学学院退休教师，中国共产党员郑容同志因病医治无效，于2020年8月14日逝世，享年69岁。</span></p><p style="text-align:left;text-indent:28px;line-height:30px"><span style="font-size:20px;font-family:黑体;color:#444444">郑容老师1990年进入北京大学分析测试中心工作，2001年获评高级工程师，于2011年10月退休。郑容老师工作兢兢业业，精益求精，为人正直，是一位深受师生爱戴的好老师。</span></p><p style="text-align:left;text-indent:28px;line-height:30px"><span style="font-size:20px;font-family:黑体;color:#444444">遵照郑容老师家属意见，丧事从简。</span></p><p style="text-align:left;text-indent:28px;line-height:30px"><span style="font-size:20px;font-family:黑体;color:#444444">郑容老师的逝世，使我们失去了一位好老师好同事，我们深感惋惜和悲痛。愿郑容老师一路走好！</span></p><p style="text-align:left;text-indent:28px;line-height:30px"><span style="font-size:20px;font-family:">&nbsp;</span></p><p style="margin-right:19px;text-align:right;text-indent:372px;line-height:30px"><span style="font-size:20px;font-family:黑体;color:#444444">北京大学化学学院</span></p><p style="margin-right:9px;text-align:right;text-indent:372px;line-height:30px"><span style="font-size:20px;font-family:黑体;color:#444444">2020</span><span style="font-size:20px;font-family:黑体;color:#444444">年8月19日</span></p>
