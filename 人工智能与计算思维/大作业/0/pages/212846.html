<h1 align="center" style="text-align: center; margin: 17pt 0cm 16.5pt"><span style="font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri"><strong><font color="#000000">讣告</font></strong></span></h1><p class="MsoNormal" style="margin: 0cm 0cm 0pt"><span lang="EN-US"><o:p><font color="#000000" face="Calibri" size="3">&nbsp;</font></o:p></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><font color="#000000"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">北京大学地球与空间科学学院地质学系高级实验师杨富绪老师，因病医治无效，于</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">2015</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">年</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">8</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">月</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">17</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">日下午</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">14</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">时</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">16</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">分在北京宣武医院逝世，享年</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">79</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">岁。</span><span lang="EN-US" style="font-size: 14pt"><o:p></o:p></span></font></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><font color="#000000"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">杨富绪老师</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">1936</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">年</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">1</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">月</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">23</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">日出生于山西平定县娘子关，</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">1956</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">年参加工作，</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">1990</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">年入党。曾任北京大学地质陈列馆馆长，是我国著名的珠宝鉴定师。对于他的去世，我们表示深切的哀悼。</span><span lang="EN-US" style="font-size: 14pt"><o:p></o:p></span></font></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><font color="#000000"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">杨富绪老师遗体告别仪式定于</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">2015</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">年</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">8</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">月</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">21</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">日上午</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">8</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">时，在八宝山兰厅举行。欲前往的老师请于</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">21</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">日早</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">6</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">时</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">50</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">分在逸夫贰楼门前乘车统一前往。</span><span lang="EN-US" style="font-size: 14pt"><o:p></o:p></span></font></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 28pt; mso-char-indent-count: 2.0"><font color="#000000"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">永远怀念杨富绪老师！</span><span lang="EN-US" style="font-size: 14pt"><o:p></o:p></span></font></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 21pt"><span lang="EN-US" style="font-size: 14pt"><o:p><font color="#000000" face="Calibri">&nbsp;</font></o:p></span></p><p class="MsoNormal" style="margin: 0cm 0cm 0pt; text-indent: 21pt"><span lang="EN-US" style="font-size: 14pt"><o:p><font color="#000000" face="Calibri">&nbsp;</font></o:p></span></p><p align="right" class="MsoNormal" style="text-align: right; margin: 0cm 0cm 0pt; text-indent: 21pt"><font color="#000000"><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">北京大学地球与空间科学学院</span><span lang="EN-US" style="font-size: 14pt"><o:p></o:p></span></font></p><p align="right" class="MsoNormal" style="text-align: right; margin: 0cm 0cm 0pt; text-indent: 21pt"><font color="#000000"><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">2015</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">年</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">8</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">月</span><span lang="EN-US" style="font-size: 14pt"><font face="Calibri">18</font></span><span style="font-size: 14pt; font-family: 宋体; mso-ascii-font-family: Calibri; mso-hansi-font-family: Calibri">日</span></font><span lang="EN-US" style="font-size: 14pt"><o:p></o:p></span></p>
