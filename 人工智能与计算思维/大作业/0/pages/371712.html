<p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><div style="mso-element:para-border-div;border:solid windowtext 2.25pt;&#10;padding:1.0pt 4.0pt 1.0pt 4.0pt"><p style="text-align:center;border:none;&#10;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:1.0pt 4.0pt 1.0pt 4.0pt"><span style="font-size:24.0pt;mso-bidi-font-size:22.0pt;font-family:黑体">讣 告</span><br/></p><p style="border:none;mso-border-alt:solid windowtext 2.25pt;&#10;padding:0cm;mso-padding-alt:1.0pt 4.0pt 1.0pt 4.0pt"><span lang="EN-US" style="font-family:黑体">&nbsp;</span></p><p style="text-indent:28.0pt;mso-char-indent-count:2.0;&#10;border:none;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:&#10;1.0pt 4.0pt 1.0pt 4.0pt"><span style="font-size:14.0pt;font-family:黑体">北京大学化学与分子工程学院陈见微老师在与癌症顽强抗争了十二年之后，终因医治无效，不幸于<span lang="EN-US">2019</span>年<span lang="EN-US">11</span>月<span lang="EN-US">26</span>日在北京逝世，享年<span lang="EN-US">84</span>岁。<span lang="EN-US"></span></span></p><p style="text-indent:28.0pt;mso-char-indent-count:2.0;&#10;border:none;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:&#10;1.0pt 4.0pt 1.0pt 4.0pt"><span style="font-size:14.0pt;font-family:黑体">陈见微老师<span lang="EN-US">1935</span>年<span lang="EN-US">10</span>月出生于浙江省乐清县。<span lang="EN-US">1957</span>年<span lang="EN-US">8</span>月毕业于北京大学，<span lang="EN-US">1957</span>年<span lang="EN-US">9</span>月留校任教，历任化学系助教、讲师、副教授，<span lang="EN-US">1991</span>年<span lang="EN-US">4</span>月退休。<span lang="EN-US"></span></span></p><p style="text-indent:28.0pt;mso-char-indent-count:2.0;&#10;border:none;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:&#10;1.0pt 4.0pt 1.0pt 4.0pt"><span style="font-size:14.0pt;font-family:黑体">陈见微老师热爱祖国，热爱教学，工作认真，为人谦和。陈见微老师的逝世，使我们失去了一位好老师好同事，我们深感惋惜和悲痛。愿陈见微老师一路走好！<span lang="EN-US"></span></span></p><p style="text-indent:28.0pt;mso-char-indent-count:2.0;&#10;border:none;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:&#10;1.0pt 4.0pt 1.0pt 4.0pt"><span style="font-size:14.0pt;font-family:黑体">按照陈见微老师本人遗愿和家属意愿，丧事从简。<span lang="EN-US"></span></span></p><p style="border:none;mso-border-alt:solid windowtext 2.25pt;&#10;padding:0cm;mso-padding-alt:1.0pt 4.0pt 1.0pt 4.0pt"><span lang="EN-US" style="font-size:14.0pt;font-family:黑体">&nbsp;</span></p><p style="border:none;mso-border-alt:solid windowtext 2.25pt;&#10;padding:0cm;mso-padding-alt:1.0pt 4.0pt 1.0pt 4.0pt"><span lang="EN-US" style="font-size:14.0pt;font-family:黑体"><span style="mso-spacerun:yes">&nbsp;</span></span></p><p style="text-align:right;word-break:break-all;&#10;border:none;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:&#10;1.0pt 4.0pt 1.0pt 4.0pt"><span style="font-size:14.0pt;font-family:黑体">北京大学化学学院<span lang="EN-US"></span></span></p><p style="text-align:right;word-break:break-all;&#10;border:none;mso-border-alt:solid windowtext 2.25pt;padding:0cm;mso-padding-alt:&#10;1.0pt 4.0pt 1.0pt 4.0pt"><span lang="EN-US" style="font-size:14.0pt;font-family:&#10;黑体">2019</span><span style="font-size:14.0pt;font-family:黑体">年<span lang="EN-US">11</span>月<span lang="EN-US">28</span>日</span><span lang="EN-US" style="font-family:黑体"></span></p></div>
