<p style="font-size: medium;white-space: normal;text-align: center"><br/></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">北京大学生命科学学院杜芝兰教授，因病医治无效于</span><span style="font-size: 19px">2022</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">9</span><span style="font-size: 19px;font-family: 宋体">月</span><span style="font-size: 19px">20</span><span style="font-size: 19px;font-family: 宋体">日在北京逝世，享年</span><span style="font-size: 19px">93</span><span style="font-size: 19px;font-family: 宋体">岁。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">杜芝兰教授</span><span style="font-size: 19px">1929</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">10</span><span style="font-size: 19px;font-family: 宋体">月生于济南，</span><span style="font-size: 19px">1985</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">5</span><span style="font-size: 19px;font-family: 宋体">月加入中国共产党，</span><span style="font-size: 19px">1954</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">9</span><span style="font-size: 19px;font-family: 宋体">月进入北京大学生物系工作，</span><span style="font-size: 19px">1992</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">9</span><span style="font-size: 19px;font-family: 宋体">月退休。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">杜芝兰教授治学严谨、言传身教、淡泊名利、待人谦和，深受广大师生的尊敬和爱戴。我们为失去这样一位良师益友而悲痛万分，杜芝兰教授的音容笑貌永远留在我们心中。愿杜芝兰教授一路走好。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">遵照家人意愿，丧事从简。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">杜芝兰教授千古！</span></p><p style=
