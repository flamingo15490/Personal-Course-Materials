<p style="line-height: normal;"><br/></p><p style="line-height: normal; text-align: center;"><strong><span style="font-family: 黑体, SimHei; font-size: 24px;">讣&nbsp; 告</span></strong></p><p style="line-height: normal;"><span style="font-family: 黑体, SimHei; font-size: 24px;"><br/></span></p><p style="text-indent: 32.15pt; line-height: 1.75em;"><span style="font-family: 黑体, SimHei; font-size: 20px;"><strong style="font-family: 黑体, SimHei; font-size: 20px;">北京大学电子学院刘金兰同志因突发疾病于</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">2025</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">年</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">8</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">月</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">日</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">19</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">时</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">55</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">分在家中逝世，享年</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">87</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">岁。</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;"></strong></span></p><p style="text-indent: 32.15pt; line-height: 1.75em;"><span style="font-family: 黑体, SimHei; font-size: 20px;"><strong style="font-family: 黑体, SimHei; font-size: 20px;">刘金兰同志</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1939</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">年出生于河北省徐水县，</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1959</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">年</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">月</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">日进入北京大学从事玻璃工工作，</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1966</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">年</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">2</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">月入党。她对待工作兢兢业业、勤勤恳恳，为电子学院物理电子所的科研工作提供了有力的支持，深受同志们的尊敬。</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;"></strong></span></p><p style="text-indent: 32.15pt; line-height: 1.75em;"><span style="font-family: 黑体, SimHei; font-size: 20px;"><strong style="font-family: 黑体, SimHei; font-size: 20px;">刘金兰同志永远活在我们心中！</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;"></strong></span></p><p style="text-indent: 32.15pt; line-height: 1.75em;"><span style="font-family: 黑体, SimHei; font-size: 20px;"><strong style="font-family: 黑体, SimHei; font-size: 20px;">遵照逝者遗愿，丧事从简，告别仪式定于</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">8</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">月</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">3</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">日下午</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">1</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">点在昌平殡仪馆久忆厅举行。</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;"></strong></span></p><p style="text-indent: 32.15pt; line-height: 1.75em;"><span style="font-family: 黑体, SimHei; font-size: 20px;"><strong style="font-family: 黑体, SimHei; font-size: 20px;">表达哀思可发邮件到</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">jywang00@pku.edu.cn</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">或周一至周五电话联系院行政办公室</strong><strong style="font-family: 黑体, SimHei; font-size: 20px;">62769956</strong><strong style="font-family: 黑体, SimHei; font-size:
