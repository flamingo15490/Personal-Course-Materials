<p style="text-align:center;text-indent:47px"><br/></p><p style="text-align:left;text-indent:47px;line-height:32px"><span style="font-size:21px;font-family:黑体;color:#444444">中国共产党党员、北京大学法学院周俊业老师，于2022年3月8日在北京逝世，享年87岁。</span></p><p style="text-align:left;text-indent:47px;line-height:32px"><span style="font-size:21px;font-family:黑体;color:#444444">周俊业老师1935年8月出生，河北省唐山市人。1955年考入北京大学法律学系学习，1958年毕业后留校工作。1958年8月至1987年10月先后在北京大学保卫部、北京大学外事处等单位任职。1987年10月调入北京大学法律系工作，1995年8月于法律系退休。</span></p><p style="text-align:left;text-indent:47px;line-height:32px"><span style="font-size:21px;font-family:黑体;color:#444444">尊重周俊业老师本人及家属意愿，丧事从简。谨此讣告，共寄哀思。</span></p><p style="text-align:left;text-indent:47px;line-height:32px"><span style="font-size:21px;font-family:黑体;color:#444444">周俊业老师千古！</span></p><p style="text-align:right;text-indent:47px;line-height:24px"><span style="font-size:21px;font-family:黑体;color:#444444">&nbsp;</span></p><p style="text-align:right;text-indent:47px;line-height:24px"><span style="font-size:21px;font-family:黑体;color:#444444">北京大学法学院</span></p><p style="text-align:right;text-indent:47px;line-height:24px"><span style="font-size:21px;font-family:黑体;color:#444444">2022</span><span style="font-size:21px;font-family:黑体;color:#444444">年3月8日</span></p><p style="text-align:center"><br/></p>
