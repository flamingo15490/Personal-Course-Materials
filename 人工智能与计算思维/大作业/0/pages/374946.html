<p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: left; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">北京大学地球与空间科学学院王晖老师因病医治无效，于二零二零年三月十四日晚二十点四十二分在北京逝世，享年八十五岁。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: left; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">王晖，女，<st1:chsdate style="font-size: 14px;" w:st="on" isrocdate="False" islunardate="False" day="2" month="2" year="1936">1936年2月2日</st1:chsdate>生，黑龙江省宾县人；毕业于东北公安干部学校，中专学历，高级会计师；1951年2月参加工作，1959年6月调入北京大学印刷厂，1978年在北京大学地理学系担任会计，1980年12月入党，1990年11月在北京大学遥感所担任会计，1991 年7月退休。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: left; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">遵家属意愿，疫情期间不举办告别仪式。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: left; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">永远怀念王晖老师！</span><span style="font-family: 宋体; font-size: 14px;">&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: left; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: right; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">北京大学地球科学学院</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align: right; text-indent: 28pt;"><span style="font-family: 宋体; font-size: 14px;">2020年3月16日</span><span style="font-family: 宋体; font-size: 14pt;"></span></p>
