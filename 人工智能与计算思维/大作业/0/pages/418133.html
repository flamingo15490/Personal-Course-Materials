ign: left; text-indent: 37px; line-height: 1.75em;"><span style="font-size:19px;font-family:宋体">尊重沈兰珠老师本人及家属意愿，丧事从简。谨此讣告，共寄哀思。</span></p><p style="margin-right: 19px; text-align: left; text-indent: 37px; line-height: 1.75em;"><span style="font-size:19px;font-family:宋体">沈兰珠老师千古！</span></p><p style="margin-right: 19px; text-align: left; text-indent: 37px; line-height: 1.75em;"><span style="font-size:19px">&nbsp;</span></p><p style="margin-right: 19px; text-align: right; text-indent: 37px; line-height: 1.75em;"><span style="font-size:19px;font-family:宋体">北京大学法学院</span></p><p style="margin-right: 19px; text-align: right; text-indent: 37px; line-height: 1.75em;"><span style="font-size:19px">2023</span><span style="font-size:19px;font-family: 宋体">年</span><span style="font-size:19px">3</span><span style="font-size:19px;font-family:宋体">月</span><span style="font-size:19px">10</span><span style="font-size:19px;font-family:宋体">日</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p>
