<p style="text-align:center"><strong><span style="font-size:20px">讣 &nbsp;告</span></strong></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-size:20px">&nbsp;</span></p><p style="text-indent:40px"><span style="font-size:20px">中国共产党党员、原北京大学力学系办公室主任刘汝沛同志因病医治无效，于2025年1月4日下午13时在北京逝世，享年88岁。</span></p><p style="text-indent:40px"><span style="font-size:20px">刘汝沛同志1936年2月15日出生，籍贯河北省沧县。1956年1月入伍于0217部队服役，1960年1月转业至北大数力系工作，1978年12月起担任力学系办公室主任，1996年3月退休。</span></p><p style="text-indent:40px"><span style="font-size:20px">刘汝沛同志政治立场坚定，作风正派，淡泊名利，甘于奉献。他工作热情负责，为人谦逊友善，深受广大师生的尊敬和爱戴。</span></p><p style="text-indent:40px"><span style="font-size:20px">深切缅怀刘汝沛同志！刘汝沛同志千古！</span></p><p style="text-indent:40px"><span style="font-size:20px">遵照家属意愿，丧事从简，谨此讣告，共寄哀思。</span></p><p style="text-indent:40px"><span style="font-size:20px">&nbsp;</span></p><p style="text-indent:40px"><span style="font-size:20px">&nbsp;</span></p><p style="text-align:right;text-indent:40px"><span style="font-size:20px">北京大学工学院</span></p><p style="text-align:right;text-indent:40px"><span style="font-size:20px">2025</span><span style="font-size:20px">年1月6日</span></p>
