<p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-indent:30.0pt;mso-char-indent-count:2.0"><span style="font-size:15.0pt;font-family:宋体">中国共产党党员、原北京大学人事处副处长刘景生同志，因病医治无效，于<span lang="EN-US">2020</span>年<span lang="EN-US">2</span>月<span lang="EN-US">19</span>日<span lang="EN-US">21</span>点<span lang="EN-US">53</span>分在北京清河<span lang="EN-US">999</span>急救中心逝世，享年<span lang="EN-US">84</span>岁。<span lang="EN-US"></span></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-indent:30.0pt;mso-char-indent-count:2.0"><span style="font-size:15.0pt;font-family:宋体">刘景生同志<span lang="EN-US">1964</span>年从北大历史系毕业后，一直在学校工作。他热爱祖国，热爱党，热爱北大，工作任劳任怨，待人诚朴厚道，为学校的发展建设奉献了一生。<span lang="EN-US"></span></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-indent:30.0pt;mso-char-indent-count:2.0"><span style="font-size:15.0pt;font-family:宋体">根据家属意愿，丧事从简。我们深切缅怀刘景生同志，为失去这样一位好同志感到万分悲痛。刘景生同志千古！<span lang="EN-US"></span></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-indent:30.0pt;mso-char-indent-count:2.0"><span style="font-size:15.0pt;font-family:宋体">谨此讣告！<span lang="EN-US"></span></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-indent:30.0pt;mso-char-indent-count:2.0"><span lang="EN-US" style="font-size:15.0pt;font-family:宋体">&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align:right;"><span lang="EN-US" style="font-size:15.0pt;font-family:宋体">&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align:right;"><span style="font-size:&#10;15.0pt;font-family:宋体">北京大学人事部<span lang="EN-US"></span></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p><p style="text-align:right;"><span lang="EN-US" style="font-size:15.0pt;font-family:宋体">2020</span><span style="font-size:15.0pt;&#10;font-family:宋体">年<span lang="EN-US">2</span>月<span lang="EN-US">20</span>日<span lang="EN-US"></span></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p>
