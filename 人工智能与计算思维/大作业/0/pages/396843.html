<p style="text-align: center;"><strong><span style="font-family: 黑体, SimHei; font-size: 24px;"><br/></span></strong></p><p style="text-align: center;"><strong><span style="font-family: 黑体, SimHei; font-size: 24px;">讣告</span></strong></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><strong><span style="font-family: 黑体, SimHei; font-size: 24px;"><br/></span></strong></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; 北京大学物理学院吴仲英副教授因病医治无效，于2021年10月13日2时在京逝世，享年88岁。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; 吴仲英老师1933年5月20日出生于北京，回族。1956年本科毕业于北京大学物理系，同年9月留校任教，1988年1月晋升为副教授，1994年8月退休。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; 吴仲英老师一生为人正直谦和，工作积极认真，治学严谨。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; &nbsp; 遵照本人遗愿及家属意见，吴仲英老师的丧事一切从简，不举行遗体告别仪式。谨此讣告，共寄哀思。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px; text-align: right;"><br/></span></p><p style="text-align: right;"><span style="font-family: 黑体, SimHei; font-size: 18px; text-align: right;">北京大学物理学院&nbsp; &nbsp;&nbsp;</span></p><p style="text-align: right;"><span style="font-family: 黑体, SimHei; font-size: 18px; text-align: right;">吴仲英老师治丧委员会&nbsp; &nbsp;&nbsp;</span></p><p style="text-align: right;"><span style="font-family: 黑体, SimHei; font-size: 18px;">2021年10月15日&nbsp; &nbsp;&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p>
