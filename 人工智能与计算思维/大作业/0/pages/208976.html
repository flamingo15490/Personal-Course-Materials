<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-ALIGN: center" align="center"><b><span style="FONT-SIZE: 42pt; FONT-FAMILY: 黑体; mso-bidi-font-size: 12.0pt">讣<span lang="EN-US"><span style="mso-spacerun: yes">&nbsp; </span></span>告<span lang="EN-US">&nbsp;&nbsp;</span></span></b>&nbsp;</p><p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 32.05pt; mso-char-indent-count: 2.0"><b><span style="FONT-SIZE: 16pt; FONT-FAMILY: 华文楷体"></span></b></p><p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 32.05pt; mso-char-indent-count: 2.0"><b><span style="FONT-SIZE: 16pt; FONT-FAMILY: 华文楷体"></span></b></p><p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 32.05pt; mso-char-indent-count: 2.0"><b><span style="FONT-SIZE: 16pt; FONT-FAMILY: 华文楷体">北京大学数学科学学院教授，中国民主同盟盟员，程乾生同志于<chsdate w:st="on" year="2010" month="12" day="3" islunardate="False" isrocdate="False"></chsdate><span lang="EN-US">2010</span>年<span lang="EN-US">12</span>月<span lang="EN-US">3</span>日在广西崇左因猝死不幸逝世，享年<span lang="EN-US">70</span>岁。</span></b>&nbsp;</p><p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 32.05pt; mso-char-indent-count: 2.0"><b><span style="FONT-SIZE: 16pt; FONT-FAMILY: 华文楷体">程乾生同志<span lang="EN-US">1940</span>年<span lang="EN-US">5</span>月<span lang="EN-US">7</span>日出生于湖南乾城。<span lang="EN-US">1963</span>年毕业于北京大学数力系概率统计专业。<span lang="EN-US">1963</span>年<span lang="EN-US">9</span>月至<span lang="EN-US">2004</span>年<span lang="EN-US">2</span>月先后在北京大学数学系任助教、讲师、副教授、教授，北京大学数学研究所副所长。<span lang="EN-US">2004</span>年<span lang="EN-US">2</span>月退休。<span lang="EN-US">&nbsp;&nbsp;</span></span></b>&nbsp;</p><p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 32.05pt; mso-char-indent-count: 2.0"><b><span style="FONT-SIZE: 16pt; FONT-FAMILY: 华文楷体">根据家属的意愿丧事从简，程乾生同志的遗体于<chsdate w:st="on" year="2010" month="12" day="5" islunardate="False" isrocdate="False"></chsdate><span lang="EN-US">2010</span>年<span lang="EN-US">12</span>月<span lang="EN-US">5</span>日在南宁火化。谨此
