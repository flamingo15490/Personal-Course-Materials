padding:1.0pt 4.0pt 27.0pt 4.0pt"><p align="center" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: center;"><br /><b style="mso-bidi-font-weight:normal"><span style="margin: 0px; font-family: 黑体; font-size: 36pt;"><font color="#000000">讣</font><span lang="EN-US" style="margin: 0px;"><span style="margin: 0px;"><font color="#000000">&nbsp; </font></span></span><font color="#000000">告</font></span></b></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none;"><span lang="EN-US" style="margin: 0px; font-size: 12pt;"><font color="#000000" face="Calibri">&nbsp;</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span lang="EN-US" style="margin: 0px; font-size: 16pt;"><font color="#000000" face="Calibri">&nbsp;</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">北京大学化学院高级实验师杨乃芳老师因病医治无效，于</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">2017</font></span><font color="#000000">年</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">1</font></span><font color="#000000">月</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">10</font></span><font color="#000000">日</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">7:30</font></span><font color="#000000">时在北京大学第三附属医院去世，享年</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">84</font></span><font color="#000000">岁。</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">杨乃芳老师</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">1932</font></span><font color="#000000">年</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">12</font></span><font color="#000000">月</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">18</font></span><font color="#000000">日生，天津市宝坻人。</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">1956</font></span><font color="#000000">年</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">3</font></span><font color="#000000">月调入北京大学化学系从事实验室工作，</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">1988</font></span><font color="#000000">年退休。</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">杨乃芳老师长期从事实验室管理工作，无私奉献，为人谦和，深得师生喜爱。对于她的去世，我们表示深切的哀悼，愿杨乃芳老师一路走好。</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">尊重杨乃芳老师生前遗愿和家属意愿，丧事从简，不开追悼会，不举行遗体告别仪式。</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">&nbsp;</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">&nbsp;</font></span></p><p align="right" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: right; text-indent: 192pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">北京大学化学与分子工程学院</font></span></p><p align="right" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: right; text-indent: 240pt;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">2017</font></span><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">年</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">1</font></span><font color="#000000">月</font><span lang="EN-US" style="margin: 0px;"><font color="#000000">10</font></span><font color="#000000">日</font></span></p></div>
