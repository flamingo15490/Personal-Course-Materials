<p style="margin-top: auto; margin-bottom: auto; line-height: 2em;"><span style="font-size:19px;font-family:黑体;color:#444444">&nbsp; &nbsp;&nbsp;</span></p><p style="margin-top: auto; margin-bottom: auto; line-height: 2em;"><span style="color: rgb(68, 68, 68); font-family: 黑体; font-size: 19px;">&nbsp; &nbsp; 北京大学图书馆退休馆员吴景华老师因病医治无效，于2024年4月22日在北京逝世，享年94岁。</span></p><p style="margin-top: auto; margin-bottom: auto; text-indent: 37px; line-height: 2em;"><span style="font-size:19px;font-family:黑体;color:#444444">吴景华老师1930年5月13日生于北京。1951年2月参加工作，1956年来北大图书馆工作，主要从事报刊阅览工作，1986年7月退休。</span></p><p style="margin-top: auto; margin-bottom: auto; text-align: left; text-indent: 37px; line-height: 2em;"><span style="font-size:19px;font-family: 黑体;color:#444444">吴景华老师三十年如一日，工作勤恳、踏实。对吴景华老师的逝世，我们表示深切哀悼！</span></p><p style="margin-top: auto; margin-bottom: auto; text-align: left; text-indent: 37px; line-height: 2em;"><span style="font-size:19px;font-family: 黑体;color:#444444">尊重吴景华老师家属意见，丧事从简。</span></p><p style="margin-top: auto; margin-bottom: auto; text-align: left; text-indent: 37px; line-height: 2em;"><span style="font-size:19px;font-family: 黑体;color:#444444">谨此讣告，共寄哀思。</span></p><p style="margin-top: auto; margin-bottom: auto; text-align: left; text-indent: 37px; line-height: 1.5em;"><span style="font-size:19px;font-family: 黑体;color:#444444"><br/></span></p><p style="margin-top: auto; margin-bottom: auto; text-align: left; text-indent: 37px; line-height: 1.5em;"><span style="font-size:19px;font-family: 黑体;color:#444444"><br/></span></p><p style="margin-top:auto;margin-bottom: auto;text-align:right;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">北京大学图书馆</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:right;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">2024</span><span style="font-size:19px;font-family:黑体;color:#444444">年4月23日</span></p>
