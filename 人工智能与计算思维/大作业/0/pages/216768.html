padding:1.0pt 4.0pt 1.0pt 4.0pt"><p align="center" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: center;"><br /><span style="margin: 0px; font-family: 黑体; font-size: 26pt;">讣<span lang="EN-US" style="margin: 0px;"><span style="margin: 0px;">&nbsp; </span></span>告</span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 14pt;">&nbsp;</span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 28pt;"><span style="margin: 0px; font-family: 黑体; font-size: 14pt;">北京大学化学学院王守信老师因病医治无效，于<span lang="EN-US" style="margin: 0px;">2018</span>年<span lang="EN-US" style="margin: 0px;">6</span>月<span lang="EN-US" style="margin: 0px;">27</span>日<span lang="EN-US" style="margin: 0px;">14</span>时<span lang="EN-US" style="margin: 0px;">0</span>分于北京<span lang="EN-US" style="margin: 0px;">309</span>医院逝世，享年<span lang="EN-US" style="margin: 0px;">88</span>岁。</span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 28pt;"><span style="margin: 0px; font-family: 黑体; font-size: 14pt;">王守信老师<span lang="EN-US" style="margin: 0px;">1930</span>年<span lang="EN-US" style="margin: 0px;">1</span>月<span lang="EN-US" style="margin: 0px;">1</span>日生，河北高阳县人，<span lang="EN-US" style="margin: 0px;">1951</span>年参加工作，曾在北京大学化学系工厂工作，后任原化学系党总支秘书至退休。</span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 28pt;"><span style="margin: 0px; font-family: 黑体; font-size: 14pt;">王守信老师对党忠诚、工作认真负责、勤勤恳恳、任劳任怨、团结同志、深得师生喜爱。对于他的去世，我们表示深切的哀悼，愿王守信老师一路走好。</span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 28pt;"><span style="margin: 0px; color: black; font-family: 黑体; font-size: 14pt;">尊重王守信老师生前遗愿和家属意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 224pt;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 14pt;">&nbsp;</span></p><p align="right" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: right; text-indent: 182pt;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 14pt;"><span style="margin: 0px;">&nbsp;</span></span><span style="margin: 0px; font-family: 黑体; font-size: 14pt;">北京大学化学与分子工程学院</span></p><p align="right" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: right; text-indent: 238pt;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 14pt;">2018</span><span style="margin: 0px; font-family: 黑体; font-size: 14pt;">年<span lang="EN-US" style="margin: 0px;">6</span>月<span lang="EN-US" style="margin: 0px;">28</span>日</span></p></div>
