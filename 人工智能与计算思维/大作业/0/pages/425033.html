<p style="text-align: center;"><span style="font-size: 20px;">讣&nbsp;&nbsp; 告&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp; 北京大学化学与分子工程学院顾菡珍教授因病不幸于2023年8月25日在家中去世，享年88岁。</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp; 顾菡珍教授1935年7月出生于江苏省苏州市，1957年7月于北京大学化学系毕业并留校任教，1994年1月获聘教授，1995年3月退休。</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp; 顾菡珍教授长期从事无机化学教学和科研工作，治学严谨，为人谦和，深受同事和学生们的尊敬和爱戴。我们深切缅怀顾菡珍教授！</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp; 遵照顾菡珍教授遗愿及家属意愿，丧事一切从简，谨此讣告，共寄哀思。</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;&nbsp; 顾菡珍教授千古！</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="text-align: right;">北京大学化学与分子工程学院</p><p style="text-align: right;">2023年9月4日</p>
