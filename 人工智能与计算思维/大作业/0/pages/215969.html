padding:1.0pt 4.0pt 1.0pt 4.0pt"><p align="center" style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-align: center;"><br /><b style="mso-bidi-font-weight:normal"><span style="margin: 0px; font-family: 黑体; font-size: 36pt;"><font color="#000000">讣<span lang="EN-US" style="margin: 0px;"><span style="margin: 0px;">&nbsp; </span></span>告</font></span></b></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 12pt;"><font color="#000000">&nbsp;</font></span></p><p style="margin: 0px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">&nbsp;</font></span></p><p style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">北京大学化学</font><span style="margin: 0px; color: black;">与分子工程学</span><font color="#000000">院教授樊杰因病医治无效，于<span lang="EN-US" style="margin: 0px;">2017</span>年<span lang="EN-US" style="margin: 0px;">12</span>月<span lang="EN-US" style="margin: 0px;">5</span>日</font><span lang="EN-US" style="margin: 0px; color: black;">8</span><span style="margin: 0px; color: black;">时<span lang="EN-US" style="margin: 0px;">19</span>分</span><font color="#000000">在北京中国中医科学院西苑医院去世，享年<span lang="EN-US" style="margin: 0px;">80</span>岁。</font></span></p><p style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">樊杰教授<span lang="EN-US" style="margin: 0px;">1937</span>年<span lang="EN-US" style="margin: 0px;">8</span>月<span lang="EN-US" style="margin: 0px;">23</span>日生于北京，<span lang="EN-US" style="margin: 0px;">1958</span>年<span lang="EN-US" style="margin: 0px;">7</span>月从北京大学化学系毕业并留校工作，<span lang="EN-US" style="margin: 0px;">1996</span>年退休。</font></span></p><p style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">樊杰教授一直从事有机化学基础课教学和科研工作，热爱教育事业，长期克服身体疾病，对教学工作认真负责，受到学生们的爱戴，为教书育人做出重要贡献。对于</font><span style="margin: 0px; color: black;">樊杰教授</span><font color="#000000">的去世，我们表示深切的哀悼，愿樊杰教授一路走好。</font></span></p><p style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-indent: 32pt;"><span style="margin: 0px; color: black; font-family: 黑体; font-size: 16pt;">尊重樊杰教授亲属意愿，</span><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">丧事从简，不举行遗体告别仪式。</font></span></p><p style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-indent: 28pt;"><span lang="EN-US" style="margin: 0px; color: rgb(92, 92, 92); font-size: 14pt;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></p><p align="right" style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-align: right; text-indent: 192pt;"><span style="margin: 0px; font-family: 黑体; font-size: 16pt;"><font color="#000000">北京大学化学与分子工程学院</font></span></p><p align="right" style="margin: 0px 0px 10px; padding: 0cm; border: medium; border-image: none; text-align: right; text-indent: 240pt; word-break: break-all;"><font color="#000000"><span lang="EN-US" style="margin: 0px; font-family: 黑体; font-size: 16pt;">2017</span><span style="margin: 0px; font-family: 黑体; font-size: 16pt;">年<span lang="EN-US" style="margin: 0px;">12</span>月<span lang="EN-US" style="margin: 0px;">5</span>日 <span style="margin: 0px;">&nbsp;</span></span></font></p></div><p style="margin: 0px;"><span lang="EN-US" style="margin: 0px;"><font color="#000000" face="Calibri" size="3">&nbsp;</font></span></p>
