<p style="text-indent:43px"><span style="font-size:21px;line-height:150%;font-family:宋体">中国共产党党员、北京大学人才交流与培训中心闻立欣同志，2020年6月21日在北京逝世，享年59岁。</span></p><p style="text-indent:43px"><span style="font-size:21px;line-height:150%;font-family:宋体">闻立欣同志热爱祖国，拥护党的方针政策，作风正派、为人谦和。我们为失去这样一位好同志、好朋友感到万分悲痛。 </span></p><p style="text-indent:43px"><span style="font-size:21px;line-height:150%;font-family:宋体">疫情期间，按照北京市的规定，遵照家属意愿，丧事从简。谨此讣告，共寄哀思。</span></p><p style="text-indent:43px"><span style="font-size:21px;line-height:150%;font-family:宋体">闻立欣同志千古！</span></p><p style="text-indent:43px"><span style="font-family: 宋体; font-size: 21px; text-align: right;"><br/></span></p><p style="text-indent: 43px; text-align: right;"><span style="font-family: 宋体; font-size: 21px; text-align: right;">北京大学人才交流与培训中心</span></p><p style="text-align: right;"><span style="font-size:21px;line-height:150%;font-family:宋体">2020</span><span style="font-size:21px;line-height:150%;font-family:宋体">年7月2日</span></p>
