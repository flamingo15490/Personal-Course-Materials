<p style="text-align:center"><strong><span style="font-size:19px">讣告</span></strong></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-size:19px">&nbsp;</span></p><p style="text-indent:37px"><span style="font-size:19px">中国共产党党员、北京大学工学院教授王肇明老师，因病医治无效，于2023年6月9日下午在北京去世，享年88岁。</span></p><p style="text-indent:37px"><span style="font-size:19px">王肇明老师于1935年2月出生，籍贯江苏省南京市，1956年9月到北京大学任教。她为人善良，品德高尚，对党忠诚，热爱教育事业并为之奉献一生。</span></p><p style="text-indent:37px"><span style="font-size:19px">深切缅怀王肇明老师！王肇明老师千古！</span></p><p style="text-indent:37px"><span style="font-size:19px">遵照家属意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-size:19px">&nbsp;</span></p><p style="text-align:right"><span style="font-size: 19px">北京大学工学院</span></p><p style="text-align:right"><span style="font-size:19px">2023</span><span style="font-size:19px">年6月12日</span></p>
