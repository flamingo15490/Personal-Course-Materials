<p style="text-align:left;text-indent:37px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;">北京大学计算中心教授级高级工程师孙绍芳同志，因病于2022年12月1日下午在北京大学医院去世，享年79岁。</span></p><p style="text-align:left;text-indent:37px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;">孙绍芳同志自1970年3月到北京大学工作以来，一直致力于北大信息化建设工作。她爱岗敬业，工作作风专业严谨、精益求精，负责并参与开发多项重要应用系统，得到领导、同事及相关部门的一致好评。<a style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;" name="_GoBack"></a>孙绍芳同志为人师表，待人热忱，深受大家爱戴。孙绍芳同志的逝世，是我们的重大损失。我们将永远怀念孙绍芳同志！</span></p><p style="text-align:left;text-indent:40px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;">根据逝者遗愿和家属意见，后事一切从简。</span></p><p style="text-align:left;text-indent:40px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; text-indent: 37px;">特此讣告。</span></p><p style="text-align:left;text-indent:37px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;">&nbsp;</span></p><p style="text-align:right;text-indent:37px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;">　　　　　　　　　　　&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;北京大学计算中心</span></p><p style="text-align:right;text-indent:37px"><span style="font-family: 楷体_GB2312, KaiTi_GB2312; font-size: 16px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 2022年12月2日</span></p>
