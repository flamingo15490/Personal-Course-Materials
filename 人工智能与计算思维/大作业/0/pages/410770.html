<p style="text-align: justify;"><span style="font-family: 仿宋_GB2312, FangSong_GB2312;">&nbsp; &nbsp; <span style="font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 16px;">中国共产党党员、北京大学保卫部退休职工雷国林同志因病医治无效，于2022年7月29日在北京逝世，享年86岁。</span></span></p><p style="text-align: justify;"><span style="font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 16px;">&nbsp; &nbsp; 雷国林同志1936年出生，1955年3月参军，1959年3月转业到北京大学参加工作，1979年11月加入中国共产党，1996年9月退休。雷国林同志工作认真负责，为人谦和有礼，我们为失去一位好同事而深感悲痛！</span></p><p style="text-align: justify;"><span style="font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 16px;">&nbsp; &nbsp; 现遵照家人意愿，丧事从简，谨此讣告。</span></p><p style="text-align: justify;"><span style="font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 16px;">&nbsp; &nbsp; 雷国林同志千古！</span></p><p style="text-align: right;"><span style="font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 16px;">北京大学保卫部</span></p><p style="text-align: right;"><span style="font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 16px;">2022年8月5日</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><br/></p>
