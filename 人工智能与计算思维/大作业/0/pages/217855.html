<p align="center" class="MsoNormal" style="text-align:center"><span style="font-family: 黑体; font-size: 18pt;">&nbsp;</span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">北京大学法学院退休教师王以真老师，因病医治无效，于</span><span lang="EN-US" style="font-size:16.0pt">2019</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">年</span><span lang="EN-US" style="font-size:16.0pt">4</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">月</span><span lang="EN-US" style="font-size:16.0pt">2</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">日在北京逝世，享年</span><span lang="EN-US" style="font-size:16.0pt">89</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">岁。</span><span lang="EN-US" style="font-size:16.0pt">&nbsp;&nbsp;&nbsp; <o:p></o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77;tab-stops:39.8pt"><span lang="EN-US" style="font-size:16.0pt">&nbsp;&nbsp; <o:p></o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">王以真老师</span><span lang="EN-US" style="font-size:16.0pt">1930</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">年</span><span lang="EN-US" style="font-size:16.0pt">8</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">月生于上海，</span><span lang="EN-US" style="font-size:16.0pt">1953</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">年</span><span lang="EN-US" style="font-size:16.0pt">11</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">月参加工作，先后任职于中国人民大学法律系、北京政法学院、北京市工业科技研究所、北京市钢窗厂、北京市粮食科技研究所等。</span><span lang="EN-US" style="font-size:16.0pt">1978</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">年</span><span lang="EN-US" style="font-size:16.0pt">12</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">月调入北京大学法律系从事教学工作，</span><span lang="EN-US" style="font-size:16.0pt">1991</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">年</span><span lang="EN-US" style="font-size:16.0pt">4</span><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">月退休。</span><span lang="EN-US" style="font-size:16.0pt"><o:p></o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span lang="EN-US" style="font-size:16.0pt"><o:p>&nbsp;</o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">王以真老师热爱教育事业，质朴谦和，勤奋严谨，深受同事学生们的尊敬和爱戴。</span><span lang="EN-US" style="font-size:16.0pt"><o:p></o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span lang="EN-US" style="font-size:16.0pt"><o:p>&nbsp;</o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span style="font-size:16.0pt;font-family:宋体;mso-ascii-font-family:Calibri;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:宋体;mso-fareast-theme-font:minor-fareast;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin">尊重其本人生前及家属意愿，丧事从简。特此讣告，共寄哀思。</span><span lang="EN-US" style="font-size:16.0pt"><o:p></o:p></span></p><p class="MsoNormal" style="text-indent:28.3pt;mso-char-indent-count:1.77"><span lang="EN-US" style
