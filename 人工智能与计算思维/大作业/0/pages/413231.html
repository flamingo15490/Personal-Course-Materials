<p style="font-size: medium;white-space: normal;text-align: center"><br/></p><p style="font-size: medium;white-space: normal;text-indent: 37px"><span style="font-size: 19px;font-family: 宋体">北京大学生命科学学院赵贵槐老师，因病医治无效，于</span><span style="font-size: 19px">2022</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">9</span><span style="font-size: 19px;font-family: 宋体">月</span><span style="font-size: 19px">23</span><span style="font-size: 19px;font-family: 宋体">日在北京逝世，享年</span><span style="font-size: 19px">94</span><span style="font-size: 19px;font-family: 宋体">岁。</span></p><p style="font-size: medium;white-space: normal;text-indent: 37px"><span style="font-size: 19px;font-family: 宋体">赵贵槐老师</span><span style="font-size: 19px">1928</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">6</span><span style="font-size: 19px;font-family: 宋体">月生于山西五台县，</span><span style="font-size: 19px">1946</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">4</span><span style="font-size: 19px;font-family: 宋体">月加入中国共产党。</span><span style="font-size: 19px">1973</span><span style="font-size: 19px;font-family: 宋体">年进入北京大学生物系工作，</span><span style="font-size: 19px">1990</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">11</span><span style="font-size: 19px;font-family: 宋体">月离休。</span></p><p style="font-size: medium;white-space: normal;text-indent: 37px"><span style="font-size: 19px;font-family: 宋体">赵贵槐老师一生忠党爱国，工作认真负责，为人谦逊友善，深受广大师生的尊敬和爱戴。对于赵贵槐老师的逝世，我们表示最深切的哀悼！愿赵贵槐老师一路走好！</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">遵照家人意愿，丧事从简。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">赵贵槐老师千古！</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px">&nbsp;</span></
