<p style="text-indent:37px"><br/></p><p style="text-align:center"><span style="font-size: 24px;"><strong style="font-size: 24px;">讣告</strong></span></p><p style="text-indent:37px"><span style="font-size:19px"></span><br/></p><p style="text-indent:37px"><span style="font-size:19px">北京大学化学与分子工程学院宋续桥老师于2024年1月24日因病在北医三院去世，享年90岁。 </span></p><p style="text-indent:37px"><span style="font-size:19px">宋续桥老师1934年3月9日出生于河北省高阳县，1956年10月进入北京大学化学系器材室从事管理工作，1986年获聘助理会计师，1995年3月光荣退休。</span></p><p style="text-indent:37px"><span style="font-size:19px">宋续桥老师对工作认真负责，为人谦和，深受师生爱戴。对于宋续桥老师的不幸离世，我们表示深切的哀悼。</span></p><p style="text-indent:19px"><span style="font-size:19px">&nbsp; &nbsp;遵照家属的意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="text-indent:37px"><span style="font-size:19px">愿宋续桥老师一路走好！</span></p><p style="text-indent: 37px; text-align: right;"><span style="font-size:19px">&nbsp;</span><span style="font-size: 19px; text-align: right;">北京大学化学与分子工程学院</span></p><p style="text-align:right"><span style="font-size: 19px; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;;">2024年1月25日</span></p>
