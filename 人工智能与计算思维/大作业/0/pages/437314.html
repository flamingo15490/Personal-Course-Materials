<p style="text-align:left;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;"><br style="font-size: 20px;"/></span></p><p style="text-align:left;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">中国共产党党员、北京大学法学院黄芝英老师，于2024年8月30日因突发疾病在北京逝世，享年92岁。</span></p><p style="text-align:left;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;"><br style="font-size: 20px;"/></span></p><p style="text-align:left;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">黄芝英老师，原名黄麟美，1932年11月出生，江苏江阴市人。1952年10月至1956年1月于北京俄语学院学习；1956年2月于北京大学工作；1980年10月调入北大法律系，长期从事《中外法学》编辑工作，为编辑部建设和学院发展做出了贡献。1992年7月退休。</span></p><p style="text-align:center;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">&nbsp;</span></p><p style="text-align:left;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">尊重黄芝英老师本人及家属意愿，丧事从简。谨此讣告，共寄哀思。</span></p><p style="text-align:center;text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">&nbsp;</span></p><p style="text-indent:43px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">黄芝英老师千古！</span></p><p style="text-indent:37px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">&nbsp;</span></p><p style="text-indent:37px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;"><br style="font-size: 20px;"/></span></p><p style="text-indent: 37px; text-align: right;"><span style="font-size: 20px;"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">&nbsp;</span><span style="font-family: 黑体; text-align: right; font-size: 20px;">北京大学法学院</span></span></p><p style="text-align:right;text-indent:37px"><span style="line-height: 150%; font-family: 黑体; font-size: 20px;">2024年9月2日</span></p>
