<p>中国共产党党员、北京大学社会学系原副系主任、离休干部游慧培同志，于2015年03月29日凌晨5：10在家中去世，享年90岁。<br />游慧培同志1925年03月03日生于北京，1948年参加工作。1983年从地质系调入社会学系，担任社会学系副系主任。游慧培同志工作认真，不辞辛劳，深受师生们的爱戴。<br />遵从游慧培同志生前遗愿及家属意愿，丧事从简，不举行遗体告别仪式。<br />愿游慧培同志一路走好！</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 北京大学社会学系<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 2015年03月30日</p><p>&nbsp;</p>
