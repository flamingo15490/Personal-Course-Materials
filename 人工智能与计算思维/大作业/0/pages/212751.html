<!--[if gte mso 9]><xml> <o:OfficeDocumentSettings>  <o:AllowPNG/> </o:OfficeDocumentSettings></xml><![endif]--><p align="center" class="p0" style="margin-top:15.6pt;margin-right:0cm;margin-bottom:15.6pt;margin-left:0cm;text-align:center"><b><span style="font-size:36.0pt">讣 告</span></b></p><p class="p15" style="margin-top:0cm;margin-right:12.6pt;margin-bottom:0cm;margin-left:12.6pt;margin-bottom:.0001pt;text-indent:28.65pt;line-height:18.75pt"><b><span style="font-size:16.0pt;font-family:黑体;mso-hansi-font-family:宋体">北京大学对外汉语教育学院杨玉秀老师因膀胱肿瘤晚期，医治无效，于<span lang="EN-US">2015</span>年<span lang="EN-US">6</span>月<span lang="EN-US">27</span>日在解放军<span lang="EN-US">304</span>医院逝世，享年<span lang="EN-US">87</span>岁。</span></b></p><p class="p0" style="margin-top:0cm;margin-right:30.65pt;margin-bottom:0cm;margin-left:12.6pt;margin-bottom:.0001pt;text-indent:28.65pt;line-height:150%"><b><span style="font-size:16.0pt;line-height:150%;font-family:黑体;mso-hansi-font-family:宋体">杨玉秀老师<span lang="EN-US">1952</span>年毕业于北京大学中文系，同年起担任清华大学东欧交换生中国语文专修班教师，后转入北京大学，一直从事对外汉语教学工作，至<span lang="EN-US">1991</span>年退休，为对外汉语教育事业做出了重要贡献。</span></b></p><p class="p0" style="margin-top:0cm;margin-right:30.65pt;margin-bottom:0cm;margin-left:12.6pt;margin-bottom:.0001pt;text-indent:28.65pt;line-height:150%"><b><span style="font-size:16.0pt;line-height:150%;font-family:黑体;mso-hansi-font-family:宋体">遵照杨玉秀老师生前意愿，丧事从简，不举行告别仪式，不开追悼会。</span></b></p><p class="p0" style="margin-top:0cm;margin-right:30.65pt;margin-bottom:0cm;margin-left:12.6pt;margin-bottom:.0001pt;text-indent:28.65pt;line-height:150%"><b><span style="font-size:16.0pt;line-height:150%;font-family:黑体;mso-hansi-font-family:宋体">我们深切怀念杨玉秀老师，愿杨玉秀老师一路走好！</span></b></p><p><b><span lang="EN-US" style="font-size:16.0pt;font-family:黑体;mso-hansi-font-family:宋体">&nbsp;</span></b></p><p align="right" class="p0" style="margin-top:0cm;margin-right:30.65pt;margin-bottom:0cm;margin-left:30.55pt;margin-bottom:.0001pt;text-align:right;line-height:150%"><b><span style="fon
