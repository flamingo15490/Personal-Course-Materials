<p style="margin-top:auto;margin-bottom: auto;text-align:center;line-height:30px"><strong><span style="font-size:24px;font-family:黑体;color:#444444">讣</span></strong><strong><span style="font-size:24px;font-family:&#39;Calibri&#39;,sans-serif;color:#444444">&nbsp;</span></strong><strong> </strong><strong><span style="font-size:24px;font-family:黑体;color:#444444">告</span></strong></p><p style="margin-top:auto;margin-bottom:auto;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">&nbsp; &nbsp; 北京大学图书馆退休馆员周黎丽老师因病医治无效，于2022年12月23日在北京逝世，享年67岁。</span></p><p style="margin-top:auto;margin-bottom:auto;text-indent:37px;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">周黎丽老师1955年12月27日生于北京。1973年5月至1974年8月在北京市海淀区苏家坨公社前沙涧大队插队，1974年8月来北大图书馆工作， 先后从事流通阅览和期刊阅览服务工作，2011年1月退休。</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:left;text-indent:37px;line-height: 30px"><span style="font-size:19px;font-family: 黑体;color:#444444">周黎丽老师在工作上勇于担当、爱岗敬业、认真细致；在生活中为人谦和、热心助人，备受同事的尊敬和喜爱。对周黎丽老师的逝世，我们表示深切哀悼！</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:left;text-indent:37px;line-height: 30px"><span style="font-size:19px;font-family: 黑体;color:#444444">尊重周黎丽老师家属意见，丧事从简。</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:left;text-indent:37px;line-height: 30px"><span style="font-size:19px;font-family: 黑体;color:#444444">谨此讣告，共寄哀思。</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:right;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">北京大学图书馆</span></p><p style="margin-top:auto;margin-bottom: auto;text-align:right;line-height:30px"><span style="font-size:19px;font-family:黑体;color:#444444">2022</span><span style="font-size:19px;font-family:黑体;color:#444444">年12月26日</span></p>
