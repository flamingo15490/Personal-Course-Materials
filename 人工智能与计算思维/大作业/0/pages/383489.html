<p style="text-align:center;text-indent:48px"><span style="font-family: 黑体,SimHei; font-size: 24px;">讣 &nbsp;&nbsp;&nbsp;告</span></p><p style="text-indent:28px"><span style="font-family: 黑体,SimHei;">&nbsp;</span></p><p style="text-align: justify; text-indent: 37px;"><span style="font-family: 黑体,SimHei; font-size: 19px;">北京大学化学学院退休职工，中国共产党员杨文盈老师因病医治无效，于2020年10月21日在北京逝世，享年80岁。</span></p><p style="text-align: justify; text-indent: 37px;"><span style="font-family: 黑体,SimHei; font-size: 19px;">杨文盈老师1959年1月来校工作，高级工，长期从事实验室设备维修工作，2001年6月退休。杨文盈老师对工作精益求精、任劳任怨，对同事学生为人谦和，深受师生爱戴。对于杨文盈老师的不幸离世，我们表示深切的哀悼。</span></p><p style="text-align: justify; text-indent: 19px;"><span style="font-family: 黑体,SimHei; font-size: 19px;">&nbsp; 遵照家属的意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="text-align: justify; text-indent: 37px;"><span style="font-family: 黑体,SimHei; font-size: 19px;">愿杨文盈老师一路走好！</span></p><p style="text-align: justify; margin-right: 19px;"><span style="font-family: 黑体,SimHei; font-size: 19px;">&nbsp;</span></p><p style="text-align: right; margin-right: 19px;"><span style="font-family: 黑体,SimHei; font-size: 19px;">北京大学化学学院</span></p><p style="text-align: right;"><span style="font-family: 黑体,SimHei; font-size: 19px;">2020年10月30日</span></p>
