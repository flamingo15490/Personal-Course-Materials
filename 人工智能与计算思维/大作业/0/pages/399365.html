<p style="text-indent:40px;line-height:200%"><span style="font-size:20px;line-height:200%;font-family: 仿宋">中国共产党党员、北京大学人事部离休干部王致荣同志，因病医治无效，于2021年12月8日在北京大学第三医院逝世，享年91岁。</span></p><p style="text-indent:40px;line-height:200%"><span style="font-size:20px;line-height:200%;font-family: 仿宋">王致荣同志热爱祖国，拥护党的方针政策，作风正派，工作积极努力，任劳任怨，诚恳待人。我们为失去这样一位好同志、好朋友感到万分悲痛。</span></p><p style="text-indent:40px;line-height:200%"><span style="font-size:20px;line-height:200%;font-family: 仿宋">王致荣同志遗体告别仪式定于2021年12月12日上午7:30在八宝山殡仪馆兰厅举行。 </span></p><p style="text-indent:40px;line-height:200%"><span style="font-size:20px;line-height:200%;font-family: 仿宋">谨此讣告！</span></p><p style="text-align:right;line-height:200%"><span style="font-size:20px;line-height:200%;font-family:仿宋">北京大学人事部</span></p><p style="text-align:right;line-height:200%"><span style="font-size:20px;line-height:200%;font-family:仿宋">2021</span><span style="font-size:20px;line-height:200%;font-family:仿宋">年12月10日</span></p>
