<table border="2" cellpadding="1" cellspacing="1" height="539" width="536">	<tbody>		<tr>			<td><!--[if gte mso 9]><xml> <o:OfficeDocumentSettings>  <o:TargetScreenSize>800x600</o:TargetScreenSize> </o:OfficeDocumentSettings></xml><![endif]-->			<p align="center" class="MsoNormal" style="text-align:center"><b style="mso-bidi-font-weight:normal"><span new="" style="font-size:26.0pt;font-family:黑体;mso-hansi-font-family:" times="">讣 告</span></b></p>			<p class="MsoNormal" style="text-indent:21.0pt"><span lang="EN-US">&nbsp;</span><br />			<span style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">&nbsp;&nbsp;&nbsp; 北京大学图书馆退休职工、研究馆员赵新月同志，因病医治无效，于<span lang="EN-US">2016</span>年<span lang="EN-US">5</span>月<span lang="EN-US">25</span>日辞世，享年<span lang="EN-US">91</span>岁。</span><br />			<span style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">&nbsp;&nbsp;&nbsp; 遵照赵新月同志家属意见，丧事从简。</span><br />			<span style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">&nbsp;&nbsp;&nbsp; 赵新月同志的逝世，使我们失去了一位好老师好同事，我们深感惋惜和悲痛。愿赵新月老师一路走好！</span></p>			<p class="MsoNormal" style="text-indent: 279pt; text-align: justify;"><span lang="EN-US">&nbsp;</span><br />			<span style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 北京大学图书馆 </span><br />			<span style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; 赵新月同志治丧委员会</span><br />			<span lang="EN-US" style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; 2016</span><span style="font-size:14.0pt;font-family:黑体;mso-hansi-font-family:Arial;mso-bidi-font-family:Arial">年<span lang="EN-US">5</span>月<span lang="EN-US">30</span>日</span></p>			<!--[if gte mso 9]><xml> <w:WordDocument>  <w:View>Normal</w:View>  <w:Zoom>0</w:Zoom>  <w:TrackMoves/>  <w:TrackFormatting/>  <w:PunctuationKerning/>  <w:DrawingGridVerticalSpacing>7.8 磅</w:DrawingGridVerticalSpacing>  <w:DisplayHorizontalDrawingGridEvery>0</w:DisplayHorizontalDrawingGridEvery>  <w:DisplayVerticalDrawingGridEvery>2</w:DisplayVerticalDrawingGridEvery>  <w:ValidateAgainstSchemas/>  <w:SaveIfXMLInvalid>false</w:SaveIfXMLInvalid>  <w:IgnoreMixedContent>false</w:IgnoreMixedContent>  <w:AlwaysShowPlaceholderText>false</w:AlwaysShowPlaceholderText>  <w:DoNotPromoteQF/>  <w:LidThemeOther>EN-US</w:LidThemeOther>  <w:LidThemeAsian>ZH-CN</w:LidThemeAsian>  <w:LidThemeComplexScript>X-NONE</w:LidThemeComplexScript>  <w:Compatibility>   <w:SpaceForUL/>   <w:BalanceSingleByteDoubleByteWidth/>   <w:DoNotLeaveBackslashAlone/>   <w:ULTrailSpace/>   <w:DoNotExpandShiftReturn/>   <w:AdjustLineHeightInTable/>   <w:BreakWrappedTables/>   <w:SnapToGridInCell/>   <w:WrapTextWithPunct/>   <w:UseAsianBreakRules/>   <w:DontGrowAutofit/>   <w:SplitPgBreakAndParaMark/>   <w:EnableOpenTypeKerning/>   <w:DontFlipMirrorIndents/>   <w:OverrideTableStyleHps/>   <w:UseFELayout/>  </w:Compatibility>  <w:BrowserLevel>MicrosoftInternetExplorer4</w:BrowserLevel>  <m:mathPr>   <m:mathFont m:val="Cambria Math"/>   <m:brkBin m:val="before"/>   <m:brkBinSub m:val="--"/>   <m:smallFrac m:val="off"/>   <m:dispDef/>   <m:lMargin m:val="0"/>   <m:rMargin m:val="0"/>   <m:defJc m:val="centerGroup"/>   <m:wrapIndent m:val="1440"/>   <m:intLim m:val="subSup"/>   <m:naryLim m:val="undOvr"/>  </m:mathPr></w:
