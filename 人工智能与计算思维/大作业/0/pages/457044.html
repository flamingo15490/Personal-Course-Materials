<p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px"><span style="font-family:微软雅黑">中国共产党党员、北京大学人事部退休干部秦凤环同志，因病医治无效，于</span><span style="font-family:微软雅黑">2026年3月12日在北京大学第三医院逝世，享年89岁。</span></span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px"><span style="font-family:微软雅黑">秦凤环同志</span><span style="font-family:微软雅黑">1936年12月26日出生于山东菏泽，1956年10月来校工作，并于同年12月加入中国共产党。她先后在北京大学物理系、无线电系、老干部处工作。1997年1月退休。</span></span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px">在北京大学工作期间，秦凤环同志为人谦逊，待人真诚，对待工作勤勉认真，恪尽职守。我们为失去这样一位优秀的同事、真挚的朋友而深感悲痛！</span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px">遵照秦凤环同志生前遗愿及家属意见，丧事从简。</span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px">谨此讣告！</span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px"><br/></span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px"></span></p><p style="text-indent:392px;text-align:right;line-height:35px"><span style="font-family: 微软雅黑;font-size: 19px">北京大学人事部</span></p><p style="text-align: right;"><span style="font-family: 微软雅黑;font-size: 19px">202</span><span style="font-family: 微软雅黑;font-size: 19px">6</span><span style="font-family: 微软雅黑;font-size: 19px">年</span><span style="font-family: 微软雅黑;font-size: 19px">3</span><span style="font-family: 微软雅黑;font-size: 19px">月</span><span style="font-family: 微软雅黑;font-size: 19px">13</span><span style="font-family: 微软雅黑;font-size: 19px">日</span></p><p style="text-indent:37px;text-autospace:ideograph-numeric;line-height:47px"><span style="font-family: 微软雅黑;font-size: 19px"><br/></span><br/></p>
