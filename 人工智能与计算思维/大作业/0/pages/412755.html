<p style="font-size: medium;white-space: normal;text-align: center"><span style="font-size: 21px;font-family: 宋体">杜锦珠教授讣告</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">北京大学生命科学学院杜锦珠教授，因病医治无效，于</span><span style="font-size: 19px">2022</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">9</span><span style="font-size: 19px;font-family: 宋体">月</span><span style="font-size: 19px">6</span><span style="font-size: 19px;font-family: 宋体">日在北京逝世，享年</span><span style="font-size: 19px">96</span><span style="font-size: 19px;font-family: 宋体">岁。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">杜锦珠教授，</span><span style="font-size: 19px">1926</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">3</span><span style="font-size: 19px;font-family: 宋体">月生于上海，</span><span style="font-size: 19px"> 1946</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">3</span><span style="font-size: 19px;font-family: 宋体">月加入中国共产党；</span><span style="font-size: 19px">1964</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">12</span><span style="font-size: 19px;font-family: 宋体">月进入北京大学生物系工作，</span><span style="font-size: 19px">1988</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">11</span><span style="font-size: 19px;font-family: 宋体">月离休。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">杜锦珠教授忠党爱国，潜心科研，治学严谨，为人师表。对杜锦珠教授的去世，我们表示深切的哀悼，她的音容笑貌永远铭记在我们心中。愿杜锦珠教授一路走好。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">遵照家属意愿，丧事从简。</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px;font-family: 宋体">杜锦珠教授千古！</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px">&nbsp;</span></p><p style="font-size: medium;white-space: normal;text-indent: 28px"><span style="font-size: 19px">&nbsp;</span></p><p style="font-size: medium; white-space: normal; text-align: right;"><span style="font-size: 19px">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span><span style="font-size: 19px;font-family: 宋体">北京大学生命科学学院</span></p><p style="font-size: medium; white-space: normal; text-indent: 355px; text-align: right;"><span style="font-size: 19px">2022</span><span style="font-size: 19px;font-family: 宋体">年</span><span style="font-size: 19px">9</span><span style="font-size: 19px;font-family: 宋体">月</span><span style="font-size: 19px">8</span><span style="font-size: 19px;font-family: 宋体">日</span></p>
