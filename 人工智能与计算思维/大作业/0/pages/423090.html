<p style="text-indent:28px">《北京大学学报（哲学社会科学版）》编审王毓钟，因病医治无效，于2023年7月3日在北京逝世，享年88岁。</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="text-indent:28px">王毓钟老师1935年生于江苏省无锡市，1956年毕业于北京大学历史系，毕业后留校工作，先后在北大校刊、党委宣传部、《北京大学学报（哲学社会科学版）》工作，曾任《北京大学学报（哲学社会科学版）》主编。</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="text-indent:28px">王毓钟老师在编辑领域辛勤工作多年，为学术研究和北京大学的对外文化交流与传播，做出了重要贡献！</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="text-indent:28px">沉痛哀悼王毓钟老师！王毓钟老师千古！</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;">&nbsp;</p><p style="text-align:right">《北京大学学报》（哲学社会科学版）编辑部</p><p style="text-align:right">2023年7月6日</p>
