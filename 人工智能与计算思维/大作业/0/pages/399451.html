<p style="text-align: center; line-height: 125%;"><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px; text-align: justify; text-indent: 383px;">&nbsp;</span><br/></p><p style="margin-top: auto; margin-bottom: auto; text-align: justify; text-indent: 383px; line-height: 1.75em;"><span style="line-height: 125%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;"></span></p><p style="text-align:center"><span style="font-size: 24px;"><strong style="font-size: 24px;"><span style="font-family: 微软雅黑, sans-serif;">讣 告</span></strong></span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-size:19px;font-family:&#39;微软雅黑&#39;,&#39;sans-serif&#39;">&nbsp;</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="line-height: 150%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">北京大学人口研究所高级实验师汪宗和老师，于2021年12月12日因病医治无效，在北京大学校医院逝世，享年88岁。</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="line-height: 150%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">汪宗和老师于1956年6月参加工作，先后在北京大学地质地理系、北京大学地理系、北京大学人口研究所工作。</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="line-height: 150%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">汪宗和老师为人坦诚热情，作风正派，工作勤勉，甘于奉献。汪宗和老师的逝世，使我们失去了一位好老师、好同事，对于他的逝世，我们表示深切的哀悼。</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="line-height: 150%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">遵照本人遗愿和家属意愿，丧事从简，不举行遗体告别仪式。</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="line-height: 150%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">我们深切怀念汪宗和老师！</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="line-height: 150%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">汪宗和老师千古！</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">&nbsp;</span></p><p style="line-height: 1.75em; text-align: justify; text-indent: 2em;"><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">&nbsp;</span></p><p style="text-align: justify; line-height: 1.75em;"><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">&nbsp;</span></p><p style="text-align: right; line-height: 1.75em;"><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">北京大学人口研究所</span></p><p style="text-align: right; line-height: 1.75em;"><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">2021年12月14日</span></p><p style="margin-top: auto; margin-bottom: auto; text-align: justify; text-indent: 383px; line-height: 1.75em;"><span style="line-height: 125%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">&nbsp;</span><br/></p><p style="margin-top: auto; margin-bottom: auto; text-align: right; text-indent: 383px; line-height: 1.75em;"><span style="line-height: 125%; font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 20px;">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span></p>
