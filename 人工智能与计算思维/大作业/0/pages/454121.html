<p style="text-align: left; text-indent: 48px; line-height: 30px;"><br/></p><p style="line-height: 32px; text-align: center;"><span style="font-family: 黑体, SimHei; font-size: 24px;"><strong style="font-family: 黑体, SimHei; font-size: 24px;"><span style="font-family: 黑体, SimHei; color: rgb(68, 68, 68);">讣&nbsp; 告</span></strong></span></p><p style=";line-height:32px"><span style="color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312; font-size: 18px;"><br/></span></p><p style="text-align: justify; text-indent: 36px; line-height: 2em;"><span style="font-size: 18px; color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312;">北京大学中国语言文学系玄英子老师因病医治无效，于2025年12月6日19时18分在北京逝世，享年83岁。</span></p><p style="text-align: justify; text-indent: 36px; line-height: 2em;"><span style="font-size: 18px; color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312;">玄英子老师1942年10月20日出生于吉林省延吉市。1961年9月至1966年7月就读于中央民族学院，1966年9月参加工作。1979年7月调入北京大学中文系资料室工作，1982年4月任馆员，1992年8月晋升为副研究馆员，2002年11月退休。玄英子老师一生工作勤恳、待人亲切，深受师生爱戴。</span></p><p style="text-align: justify; text-indent: 36px; line-height: 2em;"><span style="font-size: 18px; color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312;">沉痛悼念玄英子老师！玄英子老师千古！</span></p><p style="text-align: justify; text-indent: 36px; line-height: 2em;"><span style="font-size: 18px; color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312;">&nbsp;</span></p><p style="text-align: right; text-indent: 36px; line-height: 2em;"><span style="font-size: 18px; color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312;">北京大学中国语言文学系</span></p><p style="text-align: right; text-indent: 36px; line-height: 2em;"><span style="font-size: 18px; color: rgb(68, 68, 68); font-family: 仿宋_GB2312, FangSong_GB2312;">2025年12月8日</span></p>
