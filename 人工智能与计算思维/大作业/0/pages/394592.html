<p style="text-align: center;"><strong><span style="font-family: 黑体, SimHei; font-size: 20px;"><br/></span></strong></p><p style="text-align: center;"><strong><span style="font-family: 黑体, SimHei; font-size: 24px;">讣告</span></strong><br/></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><strong><span style="font-family: 黑体, SimHei; font-size: 20px;"><br/></span></strong></p><p style="text-indent: 2em;"><span style="font-family: 黑体, SimHei; font-size: 18px;">北京大学物理学院凝聚态物理与材料物理研究所邢峰副教授因病医治无效，于2021年8月6日11时50分在京逝世，享年76岁。</span></p><p style="text-indent: 2em;"><span style="font-family: 黑体, SimHei; font-size: 18px;">邢峰副教授1945年8月17日出生于海南省乐东黎族自治县。本科毕业于北京大学物理系，1970年3月留校任教，1992年8月晋升为副教授，2005年9月退休。</span></p><p style="text-indent: 2em;"><span style="font-family: 黑体, SimHei; font-size: 18px;">邢峰副教授一生为人正直谦和，工作积极认真，治学严谨。</span></p><p style="text-indent: 2em;"><span style="font-family: 黑体, SimHei; font-size: 18px;">遵照本人遗愿及家属意见，邢峰副教授的丧事一切从简，不举行遗体告别仪式。谨此讣告，共寄哀思。</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp; </span></p><p style="text-align: right;"><span style="font-family: 黑体, SimHei; font-size: 18px;">北京大学物理学院&nbsp; &nbsp;&nbsp;</span></p><p style="text-align: right;"><span style="font-family: 黑体, SimHei; font-size: 18px;">邢峰副教授治丧委员会&nbsp; &nbsp;&nbsp;</span></p><p style="text-align: right;"><span style="font-family: 黑体, SimHei; font-size: 18px;">2021年8月6日&nbsp; &nbsp;&nbsp;</span></p><p style="font-family:&#39;微软雅黑&#39;,&#39;Microsoft YaHei&#39;;font-size:16px;"><span style="font-family: 黑体, SimHei; font-size: 18px;">&nbsp;</span></p>
