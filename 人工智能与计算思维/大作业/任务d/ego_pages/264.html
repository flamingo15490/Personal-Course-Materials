<script>
var selectedNodeId = null;
var allNodes = network.body.data.nodes;
var allEdges = network.body.data.edges;
var origNodes = allNodes.get();
var origEdges = allEdges.get();
function buildNeighborSet(nodeId) {
    var neighbors = new Set();
    neighbors.add(String(nodeId));
    origEdges.forEach(function(e) {
        if (String(e.from) === String(nodeId)) neighbors.add(String(e.to));
        if (String(e.to) === String(nodeId)) neighbors.add(String(e.from));
    });
    return neighbors;
}
function highlightNode(nodeId) {
    var neighbors = buildNeighborSet(nodeId);
    var newNodes = origNodes.map(function(n) {
        var nid = String(n.id);
        if (neighbors.has(nid)) { return Object.assign({}, n, {opacity: 1.0}); }
        else { return Object.assign({}, n, {opacity: 0.05}); }
    });
    var newEdges = origEdges.map(function(e) {
        var fromId = String(e.from), toId = String(e.to);
        if (neighbors.has(fromId) && neighbors.has(toId)) { return Object.assign({}, e, {opacity: 0.8, width: 2}); }
        else { return Object.assign({}, e, {opacity: 0.02, width: 0.2}); }
    });
    allNodes.update(newNodes);
    allEdges.update(newEdges);
}
function resetAll() {
    allNodes.update(origNodes);
    allEdges.update(origEdges);
}
network.on("click", function(params) {
    if (params.nodes.length > 0) {
        var nodeId = String(params.nodes[0]);
        if (selectedNodeId === nodeId) { selectedNodeId = null; resetAll(); }
        else { selectedNodeId = nodeId; highlightNode(nodeId); }
    } else {
        if (selectedNodeId) { selectedNodeId = null; resetAll(); }
    }
});
</script>
