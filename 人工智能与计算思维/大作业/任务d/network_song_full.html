var selectedNodeId = null;
function doHighlight(nodeId) {
    var connEdges = network.getConnectedEdges(nodeId);
    var neighbors = new Set();
    neighbors.add(String(nodeId));
    connEdges.forEach(function(eid) {
        var e = network.body.data.edges.get(eid);
        if (e) { neighbors.add(String(e.from)); neighbors.add(String(e.to)); }
    });
    var nodeUpdates = [];
    network.body.data.nodes.forEach(function(n) {
        var sid = String(n.id);
        if (neighbors.has(sid)) {
            var nm = nodeNames[sid] || sid;
            var fs = (sid === String(nodeId)) ? 16 : 11;
            nodeUpdates.push({id: n.id, label: nm, font: {size: fs, color: "#111"}, opacity: 1.0});
        } else {
            nodeUpdates.push({id: n.id, label: "", opacity: 0.04});
        }
    });
    network.body.data.nodes.update(nodeUpdates);
    var edgeUpdates = [];
    network.body.data.edges.forEach(function(e) {
        if (neighbors.has(String(e.from)) && neighbors.has(String(e.to))) {
            edgeUpdates.push({id: e.id, opacity: 0.9, width: 2});
        } else {
            edgeUpdates.push({id: e.id, opacity: 0.02, width: 0.1});
        }
    });
    network.body.data.edges.update(edgeUpdates);
    network.setOptions({physics: {enabled: false}, interaction: {dragNodes: false, dragView: true}});
    var ndName = nodeNames[String(nodeId)] || String(nodeId);
    var nArr = [];
    neighbors.forEach(function(nid) { if (nid !== String(nodeId)) nArr.push(nodeNames[nid] || nid); });
    document.getElementById("info-bar").innerHTML = "<b>" + ndName + "</b> | 度数: " + (neighbors.size-1) + " | 邻居: " + nArr.slice(0,10).join(",") + (nArr.length>10?"...":"");
    document.getElementById("info-bar").style.display = "block";
    document.querySelectorAll(".rank-item").forEach(function(el) { el.classList.remove("active"); });
    var act = document.querySelector('.rank-item[data-pid="' + nodeId + '"]');
    if (act) act.classList.add("active");
}
function doReset() {
    network.body.data.nodes.forEach(function(n) { n.label = ""; n.opacity = 1.0; });
    network.body.data.nodes.update(network.body.data.nodes.get());
    network.body.data.edges.forEach(function(e) { e.opacity = 1.0; e.width = 0.3; });
    network.body.data.edges.update(network.body.data.edges.get());
    network.setOptions({physics: {enabled: false}, interaction: {dragNodes: false, dragView: true}});
    document.getElementById("info-bar").style.display = "none";
    selectedNodeId = null;
    document.querySelectorAll(".rank-item").forEach(function(el) { el.classList.remove("active"); });
}
network.on("click", function(params) {
    if (params.nodes.length > 0) {
        var nodeId = params.nodes[0];
        if (selectedNodeId === nodeId) { doReset(); }
        else { selectedNodeId = nodeId; doHighlight(nodeId); }
    } else {
        if (selectedNodeId !== null) doReset();
    }
});
function selectFromList(pid) {
    if (selectedNodeId === pid) { doReset(); }
    else { selectedNodeId = pid; doHighlight(pid); network.focus(pid, {scale:0.8, animation:true}); }
}
